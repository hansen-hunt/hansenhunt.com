# One-shot helper: configures GitHub Pages settings for this repo via the REST API.
# Run manually from the Actions tab. The site itself is served by GitHub Pages
# directly from main / root; this workflow does not build anything.
name: Pages settings

on:
  workflow_dispatch:
    inputs:
      https_enforced:
        description: "Set https_enforced=true (only after DNS resolves)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Enable Pages from main / root (skip if it already exists)
        run: |
          gh api -X POST "repos/$REPO/pages" \
            -f build_type=legacy -f "source[branch]=main" -f "source[path]=/" \
            || echo "Pages already exists, continuing"
      - name: Set custom domain
        run: gh api -X PUT "repos/$REPO/pages" -f cname=hansenhunt.com
      - name: Enforce HTTPS (optional)
        if: ${{ inputs.https_enforced }}
        run: gh api -X PUT "repos/$REPO/pages" -F https_enforced=true
      - name: Wait for build and print status
        run: |
          for i in $(seq 1 30); do
            status=$(gh api "repos/$REPO/pages" -q .status)
            echo "status=$status"
            [ "$status" = "built" ] && break
            sleep 10
          done
          gh api "repos/$REPO/pages"
